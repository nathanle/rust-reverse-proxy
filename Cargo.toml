[package]
name = "webserver"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-reverse-proxy = { version="1.3.0", features=["tls"] }
bytes = "1.11.1"
http-body-util = "0.1.3"
hyper = "1.10.0"
hyper-rustls = "0.27.9"
hyper-util = "0.1.20"
rustls = "0.23.40"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
